name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nearx-labs/nilo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      # Only VITE_POLLAR_API_KEY is needed at build time (Vite inlines it into the web bundle).
      # OPENAI_API_KEY, OPENAI_MODEL and SPONSOR_SECRET are read at runtime from the server's .env (docker-compose env_file).
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            VITE_POLLAR_API_KEY=${{ secrets.VITE_POLLAR_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pulls the new :latest on the server and restarts only the nilo service (Traefik is left alone).
  # The server must already be able to pull from GHCR (docker login there, or a public package).
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            cd /etc/nearx
            sudo docker compose pull nilo
            sudo docker compose up -d nilo
            sudo docker image prune -f
